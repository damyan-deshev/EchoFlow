name: Terra Unicode normalization validation

on:
  push:
    branches:
      - validation/terra-unicode-20260918

permissions:
  contents: read

jobs:
  focused-unit-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Accept SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Run focused normalizer and chunker tests
        run: ./gradlew :app:testDebugUnitTest --tests com.echoflow.data.TtsTextChunkerTest --stacktrace
